<!doctype html>
<html lang="en">

	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<body>

	<button class="get-albums">Get Albums</button>

	<div id="app">Caravan</div>

		<p class="total-out"></p>
	</div>
